<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-label="Approach A retrieves 20 sentences and makes one LLM call. Approach B is an agent that can also call a count tool over all tagger labels. Both answers are saved and scored the same way."><rect width="1100" height="450" fill="#FFFFFF"/>
