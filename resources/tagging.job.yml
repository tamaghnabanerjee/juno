resources:
  jobs:
    tagging:
      name: juno-tagging
      description: >-
        Tag every sentence into review_facts. Runs the sample and the gate first; the full-corpus
        task only runs if the gate passed, so a bad tagger is caught before the spend.
      tags:
        project: juno
      queue:
        enabled: true
      performance_target: STANDARD
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: model
          default: ${var.tagging_model}
        - name: sample_size
          default: "500"
      tasks:
        - task_key: sample_and_gate
          notebook_task:
            notebook_path: ../src/notebooks/04_tagging.py
            base_parameters:
              stage: sample
        - task_key: full_corpus
          depends_on:
            - task_key: sample_and_gate
          notebook_task:
            notebook_path: ../src/notebooks/04_tagging.py
            base_parameters:
              stage: full
