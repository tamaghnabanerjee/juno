resources:
  jobs:
    ingest:
      name: juno-ingest
      description: Download MEMD-ABSA Restaurant into the volume, then build the bronze and silver tables.
      tags:
        project: juno
      queue:
        enabled: true
      # Batch work, so the cheaper target is fine. No cluster block at all == serverless.
      performance_target: STANDARD
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../src/notebooks/01_ingest.py
