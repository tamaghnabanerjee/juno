resources:
  jobs:
    data:
      name: juno-data
      description: Download MEMD-ABSA Restaurant (bronze), then curate the silver tables.
      tags:
        project: juno
      queue:
        enabled: true
      # Batch work, so the cheaper target is fine. No cluster block at all == serverless.
      performance_target: STANDARD
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../src/notebooks/01_ingest.py
        - task_key: curate
          # Curation only runs if the download and bronze load succeeded.
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../src/notebooks/02_curate.py
